<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChessBase Web V2</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root { --border-color: #999; --bg-sidebar: #e1e1e1; }
        body { font-family: Tahoma, sans-serif; background: #ccd; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .main-app { display: grid; grid-template-columns: 550px 300px; background: #fff; border: 2px solid #555; box-shadow: 5px 5px 15px rgba(0,0,0,0.3); }
        
        /* Board Section */
        #board-wrapper { padding: 15px; background: #fdfdfd; }
        #board { width: 520px; border: 3px solid #333; }

        /* Sidebar Section */
        .sidebar { display: flex; flex-direction: column; background: var(--bg-sidebar); border-left: 2px solid var(--border-color); }
        
        .panel-header { background: #4a4a4a; color: white; padding: 5px 10px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        
        #move-history { flex-grow: 1; overflow-y: auto; background: white; margin: 5px; border: 1px solid var(--border-color); font-family: 'Courier New', monospace; font-size: 13px; height: 300px; }
        .move-row { display: grid; grid-template-columns: 30px 1fr 1fr; border-bottom: 1px solid #eee; }
        .move-num { background: #f0f0f0; padding: 2px 5px; color: #666; border-right: 1px solid #eee; }
        .move-val { padding: 2px 8px; cursor: pointer; }
        .move-val:hover { background: #d1e1ff; }

        .info-box { padding: 10px; height: 80px; font-size: 13px; border-top: 1px solid var(--border-color); }
        #status { font-weight: bold; color: #222; margin-bottom: 5px; }
        
        .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 5px; background: #ccc; }
        button { padding: 8px; font-size: 11px; cursor: pointer; font-weight: bold; border: 1px solid #777; background: #eee; }
        button:hover { background: #ddd; }
    </style>
</head>
<body>

<div class="main-app">
    <div id="board-wrapper">
        <div id="board"></div>
    </div>
    
    <div class="sidebar">
        <div class="panel-header">Notation</div>
        <div id="move-history">
            </div>

        <div class="panel-header">Live Evaluation</div>
        <div class="info-box">
            <div id="status">White to move</div>
            <div id="fen" style="font-size: 10px; color: #888; word-break: break-all;"></div>
        </div>

        <div class="toolbar">
            <button onclick="undoMove()">UNDO</button>
            <button onclick="resetGame()">NEW GAME</button>
            <button onclick="board.flip()">FLIP BOARD</button>
            <button onclick="copyFEN()">COPY FEN</button>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="script.js"></script>
</body>
</html>
