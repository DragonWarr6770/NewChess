<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carlsen Chess</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f172a" />

<!-- Chessboard.js CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessboardjs/dist/chessboard-1.0.0.min.css" />

<!-- Custom Styles -->
<style>
  /* Reset and base styles */
  html, body {
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background-color: #0f172a;
    -webkit-overflow-scrolling: touch;
  }

  /* Prevent rubber-banding on iOS & Android */
  body {
    overscroll-behavior: none;
  }

  /* Container for header and board */
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    align-items: center;
    justify-content: start;
    padding: 10px;
    box-sizing: border-box;
  }

  /* Header styles */
  header {
    width: 100%;
    text-align: center;
    margin-bottom: 8px;
  }

  h1 {
    font-size: 1.8em;
    color: #f8fafc;
    letter-spacing: 2px;
    margin: 0;
  }

  /* Quotes / Subtitle */
  #quote {
    font-size: 0.9em;
    color: #38bdf8;
    margin-top: 4px;
    font-style: italic;
    opacity: 0.8;
    transition: opacity 0.3s;
  }

  /* Chessboard container */
  #board {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    max-width: 100%;
    width: 100%;
  }

  /* Buttons container */
  #controls {
    margin-top: 10px;
    display: flex;
    gap: 10px;
  }

  button {
    min-width: 48px;
    min-height: 48px;
    padding: 8px 12px;
    font-size: 1em;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background-color: #1e293b;
    color: #f8fafc;
    transition: background-color 0.2s;
  }

  button:active {
    background-color: #38bdf8;
  }

  /* Responsive piece sizing */
  .chessboard {
    max-width: 100%;
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>CARLSEN CHESS</h1>
    <div id="quote">"The only way to beat Magnus is to play better than Magnus."</div>
  </header>
  <div id="board"></div>
  <div id="controls">
    <button id="undo" aria-label="Undo move">↺</button>
    <button id="restart" aria-label="Restart game">⟳</button>
  </div>
</div>

<!-- Chessboard.js & chess.js libraries -->
<script src="https://cdn.jsdelivr.net/npm/chessboardjs/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/dist/chess.js"></script>

<!-- Main Script -->
<script>
  // Quotes for Magnus Carlsen
  const quotes = [
    "The only way to beat Magnus is to play better than Magnus.",
    "Chess is a sport. The main thing is to keep your balance.",
    "Calculating variations is the essence of chess.",
    "In chess, as in life, patience and perseverance matter.",
    "The greatest move is the one you don’t make."
  ];
  
  // Function to cycle quotes
  function setRandomQuote() {
    const quoteEl = document.getElementById('quote');
    const quote = quotes[Math.floor(Math.random() * quotes.length)];
    quoteEl.textContent = `"${quote}"`;
  }

  setRandomQuote();

  // Initialize Chess.js
  const game = new Chess();

  // Board configuration
  const boardConfig = {
    position: 'start',
    orientation: 'white',
    pieceTheme: 'https://cdn.jsdelivr.net/npm/chessboardjs/img/chesspieces/wikipedia/{piece}.png',
    draggable: true,
    onDragStart: (source, piece, position, orientation) => {
      // Only allow move by white or when game is ongoing
      if (game.game_over() || (game.turn() === 'b' && !playerIsBlack)) return false;
    },
    onDrop: (source, target) => {
      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';
      updateStatus();
      window.setTimeout(aiMove, 300);
    },
    onSnapEnd: () => {
      updateStatus();
    }
  };

  // Initialize board
  const board = Chessboard('board', boardConfig);

  let playerIsBlack = false; // Player plays White by default

  // UI controls
  document.getElementById('undo').addEventListener('click', () => {
    game.undo();
    board.position(game.fen());
    updateStatus();
  });

  document.getElementById('restart').addEventListener('click', () => {
    game.reset();
    board.position(game.fen());
    updateStatus();
  });

  // Update status and make AI move if black
  function updateStatus() {
    // Optionally, display move history or status
  }

  // AI Engine: Simple minimax with alpha-beta pruning
  function evaluateBoard(game) {
    const pieceValues = {
      p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000,
      P: 100, N: 320, B: 330, R: 500, Q: 900, K: 20000
    };
    let totalEvaluation = 0;
    const board = game.board();
    for (let row of board) {
      for (let piece of row) {
        if (piece) {
          const value = pieceValues[piece.type.toLowerCase()];
          totalEvaluation += piece.color === 'w' ? value : -value;
        }
      }
    }
    return totalEvaluation;
  }

  // Generate all moves for current position
  function generateMoves(game) {
    return game.moves({ verbose: true });
  }

  // Minimax with alpha-beta pruning
  function minimax(game, depth, alpha, beta, isMaximizingPlayer) {
    if (depth === 0 || game.game_over()) {
      return evaluateBoard(game);
    }

    const moves = generateMoves(game);
    if (isMaximizingPlayer) {
      let maxEval = -Infinity;
      for (let move of moves) {
        game.move(move);
        const eval = minimax(game, depth - 1, alpha, beta, false);
        game.undo();
        if (eval > maxEval) maxEval = eval;
        if (eval > alpha) alpha = eval;
        if (beta <= alpha) break;
      }
      return maxEval;
    } else {
      let minEval = Infinity;
      for (let move of moves) {
        game.move(move);
        const eval = minimax(game, depth - 1, alpha, beta, true);
        game.undo();
        if (eval < minEval) minEval = eval;
        if (eval < beta) beta = eval;
        if (beta <= alpha) break;
      }
      return minEval;
    }
  }

  // AI move function
  function aiMove() {
    if (game.game_over()) return;
    if (game.turn() !== 'b') return;

    // Search depth can be adjusted for performance
    const depth = 3; // Moderate depth for performance
    let bestMove = null;
    let bestEval = -Infinity;

    const moves = generateMoves(game);
    for (let move of moves) {
      game.move(move);
      const eval = minimax(game, depth - 1, -Infinity, Infinity, false);
      game.undo();
      if (eval > bestEval) {
        bestEval = eval;
        bestMove = move;
      }
    }

    if (bestMove) {
      game.move(bestMove);
      board.position(game.fen());
      updateStatus();
    }
  }

  // Start with black AI
  window.onload = () => {
    // Optional: set player color
    // For now, player is White, AI is Black
  };
</script>

<!-- Service Worker Registration -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js').then(reg => {
        console.log('Service Worker registered:', reg);
      }).catch(err => {
        console.log('Service Worker registration failed:', err);
      });
    });
  }
</script>

</body>
</html>
