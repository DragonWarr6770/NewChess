<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carlsen Chess Mobile</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            margin: 0;
            padding: 20px 10px;
            overflow: hidden; /* Prevents accidental bounce scrolling on mobile */
        }
        
        .header {
            text-align: center;
            width: 100%;
            margin-bottom: auto;
        }
        h1 {
            color: #38bdf8;
            font-size: 1.8rem;
            margin: 5px 0;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .subtitle {
            font-style: italic;
            color: #94a3b8;
            font-size: 0.85rem;
            padding: 0 15px;
            line-height: 1.3;
        }

        /* Responsive Mobile Board Container */
        .board-container {
            width: 100%;
            max-width: 360px; /* Perfect for most phone screens */
            margin: auto 0;
            display: flex;
            justify-content: center;
        }
        #my-board {
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            overflow: hidden;
        }
        
        /* Custom Magnus Color Theme overrides */
        .white-1e1d7 { background-color: #f1f5f9 !important; }
        .black-3c85d { background-color: #334155 !important; }
        
        .controls {
            width: 100%;
            max-width: 360px;
            margin-top: auto;
            padding-bottom: 10px;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            width: 100%;
            padding: 16px; /* Large touch target for thumbs */
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            transition: background 0.2s, transform 0.1s;
        }
        button:active {
            background-color: #0369a1;
            transform: scale(0.98); /* Tactile feedback on tap */
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Carlsen Chess</h1>
        <div class="subtitle">"Some people think that if their opponent plays a beautiful game, it’s OK to lose. I don’t."</div>
    </div>

    <div class="board-container">
        <div id="my-board"></div>
    </div>

    <div class="controls">
        <button id="startBtn">New Match</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            // Player plays as White (Magnus mode)
            if (piece.search(/^b/) !== -1) return false;
        }

        function makeRandomMove () {
            var possibleMoves = game.moves();
            if (possibleMoves.length === 0) return;

            var randomIdx = Math.floor(Math.random() * possibleMoves.length);
            game.move(possibleMoves[randomIdx]);
            board.position(game.fen());
        }

        function onDrop (source, target) {
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' 
            });

            if (move === null) return 'snapback';
            window.setTimeout(makeRandomMove, 250);
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };
        
        board = Chessboard('my-board', config);

        // Fix for mobile window resizing/rotation
        $(window).resize(board.resize);

        $('#startBtn').on('click', function() {
            game.reset();
            board.start();
        });
    </script>
</body>
</html>
