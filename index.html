<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Multiplayer Chess</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <h1>Online Multiplayer Chess</h1>
    <div id="status">Connecting...</div>
    <div id="chessboard"></div>
    <button id="newGame">New Game</button>

    <script>
        const socket = new WebSocket('wss://yourserver.com'); // replace with your WebSocket server URL

        const statusDiv = document.getElementById('status');
        const chessboardDiv = document.getElementById('chessboard');
        const newGameBtn = document.getElementById('newGame');

        // Initialize your chess game here (using chess.js or similar library)
        let game = new Chess();

        // Handle WebSocket events
        socket.onopen = () => {
            statusDiv.innerText = 'Connected';
            // Join a game or create one
            socket.send(JSON.stringify({ type: 'join', room: 'default' }));
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'move') {
                // Apply move received from opponent
                game.move(data.move);
                updateBoard();
            } else if (data.type === 'yourTurn') {
                statusDiv.innerText = 'Your turn';
            } else if (data.type === 'gameStart') {
                statusDiv.innerText = 'Game started!';
            }
        };

        socket.onclose = () => {
            statusDiv.innerText = 'Disconnected';
        };

        // Function to update the chessboard display
        function updateBoard() {
            // Render your chessboard here, e.g., using chessboard.js
            // For simplicity, this is a placeholder
            chessboardDiv.innerHTML = `<pre>${game.pgn()}</pre>`;
        }

        // Handle user moves (this is a simplified example)
        // You need to integrate with a chess UI library
        function handleUserMove(move) {
            if (game.move(move)) {
                updateBoard();
                socket.send(JSON.stringify({ type: 'move', move: move }));
                // Notify opponent it's their turn
                socket.send(JSON.stringify({ type: 'yourTurn' }));
            }
        }

        // New game button
        newGameBtn.onclick = () => {
            game.reset();
            updateBoard();
            socket.send(JSON.stringify({ type: 'newGame' }));
        };

        // Placeholder for user move event
        // You should replace this with actual move handling from your UI
        document.addEventListener('keydown', (e) => {
            // Example: handle moves via keyboard or UI
        });
    </script>
</body>
</html>
