<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChessBase Web V3</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root { --sidebar-bg: #d4d4d4; --header-bg: #4a4a4a; --border: #888; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #9ea7b0; margin: 0; display: flex; justify-content: center; height: 100vh; align-items: center; }
        
        .container { display: flex; background: white; border: 1px solid #444; box-shadow: 10px 10px 30px rgba(0,0,0,0.5); }
        
        /* Board */
        #board-area { padding: 10px; background: #f0f0f0; border-right: 2px solid var(--border); }
        #board { width: 500px; }

        /* Sidebar */
        .sidebar { width: 320px; background: var(--sidebar-bg); display: flex; flex-direction: column; }
        .panel-header { background: var(--header-bg); color: white; padding: 4px 10px; font-size: 11px; font-weight: bold; border-bottom: 1px solid #000; }
        
        /* Move List Table */
        #notation { flex-grow: 1; background: white; margin: 5px; border: 1px solid var(--border); overflow-y: scroll; height: 350px; }
        .move-row { display: grid; grid-template-columns: 35px 1fr 1fr; border-bottom: 1px solid #eee; font-size: 13px; }
        .move-num { background: #e8e8e8; padding: 3px; text-align: center; color: #555; border-right: 1px solid #ddd; }
        .move-piece { padding: 3px 10px; cursor: pointer; font-weight: 500; }
        .move-piece:hover { background: #cce0ff; }

        /* Analysis Box */
        .analysis-box { padding: 10px; background: #fff; margin: 5px; border: 1px solid var(--border); font-size: 12px; height: 60px; }
        #engine-status { font-family: monospace; color: #008000; font-weight: bold; }

        .btn-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; padding: 5px; background: #999; }
        button { border: 1px solid #666; background: #eee; padding: 6px 2px; font-size: 10px; cursor: pointer; text-transform: uppercase; }
        button:hover { background: #fff; }
    </style>
</head>
<body>

<div class="container">
    <div id="board-area">
        <div id="board"></div>
    </div>
    
    <div class="sidebar">
        <div class="panel-header">NOTATION (PGN)</div>
        <div id="notation"></div>

        <div class="panel-header">ENGINE OUTPUT</div>
        <div class="analysis-box">
            <div id="status-text">White is slightly better</div>
            <div id="engine-status">depth 20/20 +0.45</div>
        </div>

        <div class="btn-group">
            <button onclick="undo()">Undo</button>
            <button onclick="board.flip()">Flip</button>
            <button onclick="reset()">New</button>
            <button onclick="copy()">Copy FEN</button>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="script.js"></script>
</body>
</html>
