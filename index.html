<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Chess Base</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f0f0; display: flex; justify-content: center; padding: 20px; }
        .container { display: flex; gap: 20px; background: white; padding: 15px; border: 1px solid #ccc; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
        #board { width: 450px; }
        .sidebar { width: 250px; display: flex; flex-direction: column; border-left: 1px solid #ddd; padding-left: 20px; }
        h3 { margin-top: 0; color: #333; font-size: 1.1rem; border-bottom: 2px solid #333; }
        #status { font-weight: bold; margin-bottom: 15px; color: #d9534f; }
        #pgn { font-size: 0.9rem; color: #666; overflow-y: auto; max-height: 300px; white-space: pre-wrap; font-family: monospace; }
        .controls { margin-top: auto; }
        button { width: 100%; padding: 10px; cursor: pointer; background: #333; color: white; border: none; }
        button:hover { background: #555; }
    </style>
</head>
<body>

<div class="container">
    <div id="board"></div>
    
    <div class="sidebar">
        <h3>GAME INFO</h3>
        <div id="status">White to move</div>
        
        <h3>MOVE LIST</h3>
        <div id="pgn"></div>

        <div class="controls">
            <button onclick="resetGame()">RESET BOARD</button>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="script.js"></script>
</body>
</html>
